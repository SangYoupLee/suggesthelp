version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: suggesthelp-postgres
    environment:
      POSTGRES_DB: suggesthelp
      POSTGRES_USER: suggesthelp
      POSTGRES_PASSWORD: suggesthelp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suggesthelp -d suggesthelp"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: suggesthelp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  worker:
    build:
      context: ../worker
    container_name: suggesthelp-worker
    environment:
      WORKER_PORT: 8001
    ports:
      - "8001:8001"

  backend:
    build:
      context: ../backend
    container_name: suggesthelp-backend
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/suggesthelp
      SPRING_DATASOURCE_USERNAME: suggesthelp
      SPRING_DATASOURCE_PASSWORD: suggesthelp
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: suggesthelp
      WORKER_BASE_URL: http://worker:8001
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      worker:
        condition: service_started

  frontend:
    build:
      context: ../frontend
    container_name: suggesthelp-frontend
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  minio-data:
